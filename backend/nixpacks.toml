# Optional. FFmpeg is now installed automatically via the
# @ffmpeg-installer/ffmpeg and @ffprobe-installer/ffprobe npm packages
# (see src/config/ffmpegBinary.ts), so this file isn't required for
# the app to work. It's kept here only as a fallback if you ever want
# Railway to use a system-installed ffmpeg instead.
[phases.setup]
nixPkgs = ["ffmpeg"]
