services:
  - type: web
    name: audiosnap-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMP_DIR
        value: /tmp/audiosnap
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_TOKEN_SECRET
        sync: false
